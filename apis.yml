aid: lunabill
name: Lunabill
description: >-
  LunaBill is an AI revenue cycle management (RCM) platform for hospitals, health
  systems, and RCM/BPO firms, built by LunaHealth Technologies, Inc. and backed by
  Y Combinator. A coordinated team of AI agents works the entire accounts receivable
  queue end to end — placing real calls to payers and waiting on hold, navigating IVR
  phone trees, checking payer portals (Availity, Waystar), working denials, filing
  appeals, and resubmitting claims — while running inside the EHR and clearinghouses
  a provider already uses (Epic, Cerner, GoRev, Waystar, Availity) and leaving a full
  audit trail on every claim. Pricing is performance based (1.5% of net collections
  recovered, nothing upfront). LunaBill is HIPAA compliant and SOC 2 Type I (Type II in
  progress). It does not currently publish a public developer API; integration is
  delivered through EHR and clearinghouse connectors rather than a documented API surface.
